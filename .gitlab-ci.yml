# Pipeline principal - Orchestrateur des pipelines enfants (propres à chaque image)

variables:
  TAG: $CI_COMMIT_SHORT_SHA
  CHARTS_DIR: Helm
  DEPLOY_PROJECT: projet_fastapi_deploy
  FF_SCRIPT_SECTIONS: "true"

  MANUAL_MODE: false  # Permettre le déclenchement manuel des jobs (utile en test)
  AUTO_DEPLOY: true
  EXECUTION_MODE: "docker"  # docker / shell


# utlisation d'un Workflow pour ajuster les variables selon le type de Runner voulu
workflow:
  rules:
    - if: '$EXECUTION_MODE == "docker"'
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
        DOCKER_TLS_VERIFY: "1"
        DOCKER_CERT_PATH: "/certs/client"
      when: always

    - when: always


stages:
  - build_push
  - aggregation
  - trigger_deploy


# Set default Job Tags based on the $EXECUTION_MODE variable
# Influence le choix du Runner par le tag : Shell ou Docker
# Les runners doivent être tagués correctement 'shell-executor' ou 'docker-executor'
default:
  tags:
    - ${EXECUTION_MODE}-executor


# ----------------------------------------------
# Job Rules Templates
# ----------------------------------------------

.job_rules:
  rules:
    # déclencher si les fichiers du dossiers changent (matche aussi sur trigger, sans git diff)
    # - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event)$/'
    - changes:
        - $IMAGENAME/*
        - $IMAGENAME/**/*
    # fallback de déclenchement manuel si activé
    - if: '$MANUAL_MODE =~ /^(1|true|yes)$/'
      when: manual
    # sinon, ne jamais déclencher
    - when: never


# ----------------------------------------------
# Trigger Build, Run, Push child
# ----------------------------------------------

frontend_build:
  stage: build_push
  extends: .job_rules
  trigger:
    include: ".gitlab/ci/templates/build-template-dind.yml"
    strategy: depend
  variables:
    # vérifie la valeur des variables et échoue si absentes. Vide ou "disabled" pour annuler le check.
    ENABLE_PRECHECK: false
    REQUIRED_VARS: "EXECUTION_MODE IMAGENAME TAG HOSTPORT CONTAINERPORT URL_PATH"
    IMAGENAME: frontend
    HOSTPORT: 6080
    CONTAINERPORT: 80
    URL_PATH: "/"


backend_build:
  stage: build_push
  extends: .job_rules
  trigger:
    include: ".gitlab/ci/templates/build-template-dind.yml"    # .gitlab/ci/templates/build-template.yml
    strategy: depend
  variables:
    # vérifie la valeur des variables et échoue si absente. Vide ou "disabled" pour annuler le check.
    ENABLE_PRECHECK: false
    REQUIRED_VARS: "EXECUTION_MODE IMAGENAME TAG HOSTPORT CONTAINERPORT URL_PATH"    
    IMAGENAME: backend
    HOSTPORT: 7800
    CONTAINERPORT: 8000
    URL_PATH: "/api/v1/utils/health-check/"


# ----------------------------------------------
# Build & Push Jobs results aggregation
# - Détecter les jobs build_push qui ont réussi
# - Aggréger les résultats au format image:tag
# ----------------------------------------------

frontend_updated:
  stage: aggregation
  image: ubuntu:24.04
  extends: .job_rules
  variables:
    IMAGENAME: frontend
  needs:
    - job: frontend_build
  script:
    - echo "frontend" > frontend.image
  artifacts:
    when: on_success
    paths:
      - frontend.image


backend_updated:
  stage: aggregation
  image: ubuntu:24.04
  extends: .job_rules
  variables:
    IMAGENAME: backend
  needs:
    - job: backend_build
  script:
    - echo "backend" > backend.image
  artifacts:
    when: on_success
    paths:
      - backend.image


aggregate_images:
  stage: aggregation
  image: ubuntu:24.04
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event)$/ && $AUTO_DEPLOY == "true"'
      changes:
        - frontend/**/*
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline|web)$/'
    - if: '$MANUAL_MODE =~ /^(1|true|yes)$/'
      when: manual
    - when: never
  needs:
    - job: frontend_updated
      optional: true
    - job: backend_updated
      optional: true
  script:
    - |
      if compgen -G "*.image" > /dev/null; then
        UPDATED_IMAGES=$(cat *.image | paste -sd "," -)
        echo "UPDATED_IMAGES=$UPDATED_IMAGES" >> deploy.env
      fi

      if [ -z "$UPDATED_IMAGES" ]; then
        echo "Error: Images list is empty. It must contain at least one image name."
        exit 1
      fi

      echo "UPDATED_TAG=$TAG" >> deploy.env

      echo "Checking dotenv artifact..."
      cat deploy.env

  artifacts:
    reports:
      dotenv: deploy.env


# ----------------------------------------------
# Trigger Deploy Project
# - Transmettre le résultat agrégé au pipeline Deploy
# ----------------------------------------------

update_deploy:
  stage: trigger_deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|merge_request_event)$/ && $AUTO_DEPLOY == "true"'
      changes:
        - frontend/**/*
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline|web)$/'
    - if: '$MANUAL_MODE =~ /^(1|true|yes)$/'
      when: manual
    - when: never
  needs:
    - aggregate_images
  trigger:
    # déclencher le pipeline deploy sur le même nom de branche que App
    project: $CI_PROJECT_NAMESPACE/projet_fastapi_deploy
    branch: $CI_COMMIT_REF_NAME
    strategy: mirror
  inherit:
    variables:
      - AUTO_DEPLOY
  variables:
    # Variables récupérées dans l'artifact dotenv via needs: aggregate_images
    UPDATED_IMAGES: $UPDATED_IMAGES
    UPDATED_TAG: $UPDATED_TAG
